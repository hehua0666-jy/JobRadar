name: Update JobRadar Changes

on:
  workflow_dispatch:
  push:
    paths:
      - 'jobs.json'

permissions:
  contents: write

jobs:
  build-change-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate change log
        run: python tools/diff_jobs.py

      - name: Commit generated change files
        run: |
          git config user.name "jobradar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changes.json data/jobs_previous.json
          git diff --cached --quiet || git commit -m "chore: update JobRadar change log"
          git push
